# Builds an UNSIGNED IPA on every push. Needs no Apple account or secrets:
# SideStore signs the IPA with your Apple ID when you install it.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Test core rules
        run: swift test --package-path Packages/RoostChatCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned archive
        env:
          ENABLE_SILENT_AUDIO: ${{ vars.ENABLE_SILENT_AUDIO }}
        run: |
          CONDITIONS=""
          if [ "$ENABLE_SILENT_AUDIO" = "true" ]; then
            # The audio background mode lets the optional silent audio keep the app
            # running. Apple review may reject it: see docs/DISTRIBUTION.md.
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" -c "Add :UIBackgroundModes:0 string audio" RoostChat/Info.plist
            CONDITIONS="$CONDITIONS SILENT_AUDIO"
          fi
          RELEASE_CONDITIONS="$CONDITIONS"
          xcodebuild archive \
            -project RoostChat.xcodeproj \
            -scheme RoostChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RoostChat.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            RELEASE_CONDITIONS="$RELEASE_CONDITIONS" \
            > build.log 2>&1 || {
              echo "::group::Compiler errors"
              grep -E "error:" build.log | sort -u | head -100
              echo "::endgroup::"
              tail -40 build.log
              exit 1
            }

      - name: Package IPA
        run: |
          APP=build/RoostChat.xcarchive/Products/Applications/RoostChat.app
          test -x "$APP/RoostChat"
          lipo -info "$APP/RoostChat"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../RoostChat.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: RoostChat-unsigned-ipa
          path: build/RoostChat.ipa
          retention-days: 30
          if-no-files-found: error

  release:
    # Tagged builds get a stable public download URL for sideloading.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RoostChat-unsigned-ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" RoostChat.ipa --generate-notes
