# Source of truth for the Xcode project. RoostChat.xcodeproj is generated from this
# by XcodeGen and is not committed. Run: xcodegen generate
name: RoostChat
options:
  bundleIdPrefix: io.github.lazy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Martin:
    url: https://github.com/tigase/Martin
    # Master, for connection fixes newer than the last tag (3.2.4, March 2023).
    revision: 6daa5f871bbbb4022d7c99f3108ae7345e8b46c1
  RoostChatCore:
    path: Packages/RoostChatCore
targets:
  RoostChat:
    type: application
    platform: iOS
    sources:
      - path: RoostChat
    dependencies:
      - package: Martin
      - package: RoostChatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lazy.roostchat
        # Set by the App Store Connect workflow. It's indirect so that the profile
        # only applies to this target: package targets reject provisioning profiles.
        PROVISIONING_PROFILE_SPECIFIER: $(RELEASE_PROFILE_NAME)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Silent audio (RoostChat/Services/BackgroundKeeper.swift) is left out of
        # releases because Apple's guideline 2.5.4 likely disallows it. To bring it
        # back, add SILENT_AUDIO to this setting and add this under info/properties:
        #   UIBackgroundModes:
        #     - audio
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
    info:
      path: RoostChat/Info.plist
      properties:
        CFBundleDisplayName: RoostChat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Only TLS from the OS and password authentication: exempt encryption.
        ITSAppUsesNonExemptEncryption: false
schemes:
  RoostChat:
    build:
      targets:
        RoostChat: all
    run:
      config: Debug
    archive:
      config: Release
