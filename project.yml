# Source of truth for the Xcode project. RoostChat.xcodeproj is generated from this
# by XcodeGen and is not committed. Run: xcodegen generate
name: RoostChat
options:
  bundleIdPrefix: io.github.lazy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Martin:
    url: https://github.com/tigase/Martin
    # Master, for connection fixes newer than the last tag (3.2.4, March 2023).
    revision: 6daa5f871bbbb4022d7c99f3108ae7345e8b46c1
  RoostChatCore:
    path: Packages/RoostChatCore
targets:
  RoostChat:
    type: application
    platform: iOS
    sources:
      - path: RoostChat
    dependencies:
      - package: Martin
      - package: RoostChatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lazy.roostchat
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: RoostChat/Info.plist
      properties:
        CFBundleDisplayName: RoostChat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Silent audio keeps the connection alive; see BackgroundKeeper.
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Only TLS from the OS and password authentication: exempt encryption.
        ITSAppUsesNonExemptEncryption: false
schemes:
  RoostChat:
    build:
      targets:
        RoostChat: all
    run:
      config: Debug
    archive:
      config: Release
